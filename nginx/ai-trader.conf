# AI-Trader Nginx Configuration
# Minimal deployment: single port (80) serves frontend + proxies backend
#
# Install:
#   sudo cp nginx/ai-trader.conf /etc/nginx/sites-available/ai-trader
#   sudo ln -sf /etc/nginx/sites-available/ai-trader /etc/nginx/sites-enabled/ai-trader
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or use: ./deploy.sh --nginx

server {
    listen 80;
    server_name _;

    # Frontend static files
    # IMPORTANT: Replace __PROJECT_DIR__ with actual path when deploying
    # (deploy.sh --nginx does this automatically)
    root __PROJECT_DIR__/docs;
    index index.html;

    # Static file caching
    location ~* \.(css|js|svg|png|jpg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Frontend pages - serve static files, fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # MCP services (SSE transport — disable buffering)
    location /mcp/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requires no buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header X-Accel-Buffering no;
    }

    # Swagger UI & ReDoc
    location /docs {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://127.0.0.1:8888;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Logging
    access_log /var/log/nginx/ai-trader.access.log;
    error_log /var/log/nginx/ai-trader.error.log;
}
