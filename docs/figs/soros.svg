  <rect x="33" y="24" width="10" height="7" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="31" y1="27" x2="33" y2="27" stroke="#333" stroke-width="1.5"/>
  <line x1="21" y1="26" x2="18" y2="25" stroke="#333" stroke-width="1.2"/>
  <line x1="43" y1="26" x2="46" y2="25" stroke="#333" stroke-width="1.2"/>
